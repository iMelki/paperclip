name: Sync from Upstream

# Dispatch only. The weekly schedule was removed: it ran on a GitHub-hosted
# runner, and the rf-paperclip box runner refuses schedule events (pc-guard).
# All 25 runs on record (since May) failed; the latest on an upstream merge conflict.
on:
  workflow_dispatch:

jobs:
  sync:
    name: Sync fork master with paperclipai/paperclip
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [rf-paperclip]
    # The rf-slot job-started hook runs inside this job and its wait counts toward
    # timeout-minutes: up to 15 min (RF_MEM_WAIT 900s) for free memory plus up to
    # 30 min (RF_SLOT_TIMEOUT 1800s) for one of the 2 box-wide slots, so 45 min
    # of hook budget plus 10 min of work.
    timeout-minutes: 55
    permissions:
      contents: write

    steps:
      - name: Merge upstream into fork master
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.mergeUpstream({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                branch: 'master',
              });
              core.info('Upstream sync complete — fork master is up to date.');
            } catch (err) {
              if (err.status === 409) {
                core.warning('Merge conflict detected. Manual reconciliation required.');
                core.setFailed('Upstream sync skipped due to conflict — reconcile manually.');
              } else {
                throw err;
              }
            }
