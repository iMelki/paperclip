name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      skip_llm:
        description: "Skip LLM-dependent assertions (default: true)"
        type: boolean
        default: true

jobs:
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [rf-paperclip]
    # The rf-slot job-started hook runs inside this job and its wait counts toward
    # timeout-minutes: up to 15 min (RF_MEM_WAIT 900s) for free memory plus up to
    # 30 min (RF_SLOT_TIMEOUT 1800s) for one of the 2 box-wide slots, so 45 min
    # of hook budget plus 30 min of work.
    timeout-minutes: 75
    env:
      PAPERCLIP_E2E_SKIP_LLM: ${{ inputs.skip_llm && 'true' || 'false' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PAPERCLIP_PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: google-chrome --version

      - name: Prepare this job's e2e home
        # One canonical dir per run, attempt and job under RUNNER_TEMP, with an
        # identity marker. The cleanup step deletes only this dir.
        run: ./scripts/ci/e2e-owned-cleanup.sh prepare

      - name: Run e2e tests
        env:
          # Keep temp files and unix sockets out of the box's long-lived /tmp.
          TMPDIR: ${{ runner.temp }}
          PAPERCLIP_PLAYWRIGHT_CHANNEL: "chrome"
        # The wrapper points playwright.config.ts's PAPERCLIP_HOME at this job's
        # owned dir via PAPERCLIP_E2E_HOME and records the session it starts, so
        # cleanup can tell this job's processes and home apart.
        run: ./scripts/ci/e2e-owned-cleanup.sh run -- pnpm run test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14

      - name: Clean up this job's e2e server and temp home
        # Kills only processes this job started (recorded session leader PID
        # plus start time, and the run's owner token in each process
        # environment) and deletes only this job's canonical home dir under
        # RUNNER_TEMP after checking its identity marker. No pattern, port or
        # /tmp matching, so a concurrent job on the same box is never touched.
        # Best effort: never fails the job.
        if: always()
        run: ./scripts/ci/e2e-owned-cleanup.sh cleanup
