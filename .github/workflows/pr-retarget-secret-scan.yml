name: PR retarget secret scan

# `pr.yml` does not run when only a pull request's base branch changes, so a
# retarget would keep the scan result for the old base..head range. This
# workflow re-scans the current range on every edit. The scan is cheap, and a
# job-level base-change condition would let a later title or body edit cancel an
# in-progress retarget scan and leave a skipped run superseding a failed one. The
# separate concurrency group means this run never cancels the real PR checks in
# `pr.yml`.
on:
  pull_request:
    types:
      - edited

concurrency:
  group: pr-retarget-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secret-scan-retarget:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [rf-paperclip]
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Keep the pinned version and checksum in sync with `secret-scan` in pr.yml.
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          asset="gitleaks_${version}_linux_x64.tar.gz"
          expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          install_dir="$RUNNER_TEMP/gitleaks-$version"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --output "$install_dir/$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${asset}"
          printf '%s  %s\n' "$expected" "$install_dir/$asset" | sha256sum --check --strict
          tar -xzf "$install_dir/$asset" -C "$install_dir" gitleaks
          echo "PAPERCLIP_GITLEAKS_BIN=$install_dir/gitleaks" >> "$GITHUB_ENV"
          "$install_dir/gitleaks" version

      - name: Scan the retargeted pull-request commit range
        run: >-
          node scripts/verify-gitleaks.mjs --range
          "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
