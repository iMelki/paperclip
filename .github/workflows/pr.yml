name: PR

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secret-scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(github.repository == 'iMelki/paperclip' && github.repository_id == '1228063587' && toJSON(github.event.repository.private) == 'false' && '["ubuntu-24.04"]' || '["self-hosted","paperclip-public-ci-denied"]') }}
    # Public context selects an isolated standard VM; any fallback fails before checkout.
    timeout-minutes: 55
    permissions:
      contents: read

    steps:
      - name: Confirm approved public CI context
        id: public_ci_guard
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_REPOSITORY_ID: ${{ github.repository_id }}
          CI_PRIVATE: ${{ toJSON(github.event.repository.private) }}
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_RUNNER_OS: ${{ runner.os }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          test "$CI_REPOSITORY" = "iMelki/paperclip"
          test "$CI_REPOSITORY_ID" = "1228063587"
          test "$CI_PRIVATE" = "false"
          test "$CI_RUNNER_ENVIRONMENT" = "github-hosted"
          test "$CI_RUNNER_OS" = "Linux"
          test "$CI_RUNNER_ARCH" = "X64"

      - name: Checkout complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pin the required Node version instead of relying on the runner image.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          asset="gitleaks_${version}_linux_x64.tar.gz"
          expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          install_dir="$RUNNER_TEMP/gitleaks-$version"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --output "$install_dir/$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${asset}"
          printf '%s  %s\n' "$expected" "$install_dir/$asset" | sha256sum --check --strict
          tar -xzf "$install_dir/$asset" -C "$install_dir" gitleaks
          echo "PAPERCLIP_GITLEAKS_BIN=$install_dir/gitleaks" >> "$GITHUB_ENV"
          "$install_dir/gitleaks" version

      - name: Prove range scanning with the pinned Gitleaks
        # Real-scanner check: an in-range secret fails, an out-of-range one is
        # skipped, and an unreadable range fails closed.
        run: node --test scripts/verify-gitleaks.test.mjs
        env:
          PAPERCLIP_GITLEAKS_REAL_BIN: ${{ env.PAPERCLIP_GITLEAKS_BIN }}

      - name: Scan pull-request commit range
        run: >-
          node scripts/verify-gitleaks.mjs --range
          "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  policy:
    needs: [secret-scan]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(github.repository == 'iMelki/paperclip' && github.repository_id == '1228063587' && toJSON(github.event.repository.private) == 'false' && '["ubuntu-24.04"]' || '["self-hosted","paperclip-public-ci-denied"]') }}
    # Public context selects an isolated standard VM; any fallback fails before checkout.
    timeout-minutes: 50
    outputs:
      lockfile_regenerated: ${{ steps.regen_lockfile.outputs.regenerated }}
      lockfile_parts_count: ${{ steps.lockfile_transfer.outputs.count }}
      lockfile_part_0: ${{ steps.lockfile_transfer.outputs.part_0 }}
      lockfile_part_1: ${{ steps.lockfile_transfer.outputs.part_1 }}
      lockfile_part_2: ${{ steps.lockfile_transfer.outputs.part_2 }}
      lockfile_part_3: ${{ steps.lockfile_transfer.outputs.part_3 }}
      lockfile_part_4: ${{ steps.lockfile_transfer.outputs.part_4 }}
      lockfile_part_5: ${{ steps.lockfile_transfer.outputs.part_5 }}
      lockfile_part_6: ${{ steps.lockfile_transfer.outputs.part_6 }}
      lockfile_part_7: ${{ steps.lockfile_transfer.outputs.part_7 }}

    steps:
      - name: Confirm approved public CI context
        id: public_ci_guard
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_REPOSITORY_ID: ${{ github.repository_id }}
          CI_PRIVATE: ${{ toJSON(github.event.repository.private) }}
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_RUNNER_OS: ${{ runner.os }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          test "$CI_REPOSITORY" = "iMelki/paperclip"
          test "$CI_REPOSITORY_ID" = "1228063587"
          test "$CI_PRIVATE" = "false"
          test "$CI_RUNNER_ENVIRONMENT" = "github-hosted"
          test "$CI_RUNNER_OS" = "Linux"
          test "$CI_RUNNER_ARCH" = "X64"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Block manual lockfile edits
        if: >-
          github.head_ref != 'chore/refresh-lockfile' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          # Diff the PR branch against its merge base so recent base-branch commits
          # do not masquerade as changes made by the PR itself.
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")"
          if printf '%s\n' "$changed" | grep -qx 'pnpm-lock.yaml'; then
            echo "Do not commit pnpm-lock.yaml in pull requests. CI owns lockfile updates."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate Dockerfile deps stage
        run: node ./scripts/check-docker-deps-stage.mjs

      - name: Reject git push in adapter/runtime code
        run: node ./scripts/check-no-git-push.mjs

      - name: Test no-git-push check
        run: node --test ./scripts/check-no-git-push.test.mjs

      - name: Test general-server shard partition
        run: node --test ./scripts/__tests__/run-vitest-stable-shard.test.mjs

      - name: Test e2e shard partition
        run: node --test ./scripts/__tests__/e2e-shard.test.mjs

      - name: Test bounded lockfile transfer
        run: node --test ./.github/tests/ci-lockfile-transfer.test.mjs

      - name: Test e2e owned cleanup
        run: node --test ./scripts/__tests__/e2e-owned-cleanup.test.mjs

      - name: Test release verify workflow wiring
        run: node --test ./scripts/__tests__/release-verify-workflow.test.mjs

      - name: Test standalone package build concurrency
        run: node --test ./scripts/__tests__/build-standalone-concurrency.test.mjs

      - name: Test cross-platform build filesystem helper
        run: node --test ./scripts/__tests__/build-filesystem.test.mjs

      - name: Validate release package manifest
        run: node ./scripts/release-package-map.mjs check

      - name: Verify release package bootstrap for changed manifests
        run: |
          mapfile -t changed_paths < <(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          PAPERCLIP_RELEASE_BOOTSTRAP_BASE_SHA="${{ github.event.pull_request.base.sha }}" \
            node ./scripts/check-release-package-bootstrap.mjs "${changed_paths[@]}"

      - name: Validate dependency resolution when manifests change
        id: regen_lockfile
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")"
          manifest_pattern='(^|/)package\.json$|^pnpm-workspace\.yaml$|^\.npmrc$|^pnpmfile\.(cjs|js|mjs)$|^patches/'
          if printf '%s\n' "$changed" | grep -Eq "$manifest_pattern"; then
            pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
            echo "regenerated=1" >> "$GITHUB_OUTPUT"
          else
            echo "regenerated=0" >> "$GITHUB_OUTPUT"
          fi

      # Job outputs preserve identical lock bytes without cache or artifact storage.
      # GITHUB_SHA is the shared tested PR merge revision for all default checkouts.
      - name: Share bounded hash-bound regenerated lockfile
        id: lockfile_transfer
        if: steps.regen_lockfile.outputs.regenerated == '1'
        run: |
          node --input-type=module <<'JS'
          import { appendFile, readFile } from "node:fs/promises";
          import { encodeLockfileOutputs } from "./.github/scripts/ci-lockfile-transfer.mjs";
          const { count, parts } = encodeLockfileOutputs(await readFile("pnpm-lock.yaml"), process.env.GITHUB_SHA);
          const lines = [`count=${count}`, ...parts.map((part, i) => `part_${i}=${part}`)];
          await appendFile(process.env.GITHUB_OUTPUT, lines.join("\n") + "\n");
          JS

  typecheck_release_registry:
    name: Typecheck + Release Registry
    needs: [policy]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(github.repository == 'iMelki/paperclip' && github.repository_id == '1228063587' && toJSON(github.event.repository.private) == 'false' && '["ubuntu-24.04"]' || '["self-hosted","paperclip-public-ci-denied"]') }}
    # Public context selects an isolated standard VM; any fallback fails before checkout.
    timeout-minutes: 65

    steps:
      - name: Confirm approved public CI context
        id: public_ci_guard
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_REPOSITORY_ID: ${{ github.repository_id }}
          CI_PRIVATE: ${{ toJSON(github.event.repository.private) }}
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_RUNNER_OS: ${{ runner.os }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          test "$CI_REPOSITORY" = "iMelki/paperclip"
          test "$CI_REPOSITORY_ID" = "1228063587"
          test "$CI_PRIVATE" = "false"
          test "$CI_RUNNER_ENVIRONMENT" = "github-hosted"
          test "$CI_RUNNER_OS" = "Linux"
          test "$CI_RUNNER_ARCH" = "X64"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore hash-bound regenerated lockfile
        if: needs.policy.outputs.lockfile_regenerated == '1'
        env:
          LOCKFILE_PARTS_COUNT: ${{ needs.policy.outputs.lockfile_parts_count }}
          LOCKFILE_PART_0: ${{ needs.policy.outputs.lockfile_part_0 }}
          LOCKFILE_PART_1: ${{ needs.policy.outputs.lockfile_part_1 }}
          LOCKFILE_PART_2: ${{ needs.policy.outputs.lockfile_part_2 }}
          LOCKFILE_PART_3: ${{ needs.policy.outputs.lockfile_part_3 }}
          LOCKFILE_PART_4: ${{ needs.policy.outputs.lockfile_part_4 }}
          LOCKFILE_PART_5: ${{ needs.policy.outputs.lockfile_part_5 }}
          LOCKFILE_PART_6: ${{ needs.policy.outputs.lockfile_part_6 }}
          LOCKFILE_PART_7: ${{ needs.policy.outputs.lockfile_part_7 }}
        run: |
          node --input-type=module <<'JS'
          import { writeFile } from "node:fs/promises";
          import { decodeLockfileOutputs } from "./.github/scripts/ci-lockfile-transfer.mjs";
          await writeFile("pnpm-lock.yaml", decodeLockfileOutputs(process.env.LOCKFILE_PARTS_COUNT, Array.from({ length: 8 }, (_, i) => process.env[`LOCKFILE_PART_${i}`]), process.env.GITHUB_SHA));
          JS

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspaces whose build scripts skip TypeScript
        run: pnpm run typecheck:build-gaps

      - name: Verify release registry test coverage
        run: pnpm run test:release-registry

  general_tests:
    name: General tests (${{ matrix.group_label }})
    needs: [policy]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(github.repository == 'iMelki/paperclip' && github.repository_id == '1228063587' && toJSON(github.event.repository.private) == 'false' && '["ubuntu-24.04"]' || '["self-hosted","paperclip-public-ci-denied"]') }}
    # Public context selects an isolated standard VM; any fallback fails before checkout.
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          # The server suite is pinned to maxWorkers=1 (server/vitest.config.ts),
          # so it can only be parallelized across runners. Shard it to keep this
          # lane off the PR critical path. Five shards because the suite has
          # grown to ~946s of serial vitest wall time (run 30930345729,
          # 2026-08-04): at four shards the worst shard ran 311s and was the
          # slowest check in the whole PR run; five brings each shard to ~196s
          # of suite time (~240s job), level with the other ~250-300s lanes.
          - group: general-server
            group_label: server (1/5)
            shard_index: 0
            shard_count: 5
          - group: general-server
            group_label: server (2/5)
            shard_index: 1
            shard_count: 5
          - group: general-server
            group_label: server (3/5)
            shard_index: 2
            shard_count: 5
          - group: general-server
            group_label: server (4/5)
            shard_index: 3
            shard_count: 5
          - group: general-server
            group_label: server (5/5)
            shard_index: 4
            shard_count: 5
          - group: general-workspaces-a
            group_label: workspaces-a
          - group: general-workspaces-b
            group_label: workspaces-b

    steps:
      - name: Confirm approved public CI context
        id: public_ci_guard
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_REPOSITORY_ID: ${{ github.repository_id }}
          CI_PRIVATE: ${{ toJSON(github.event.repository.private) }}
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_RUNNER_OS: ${{ runner.os }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          test "$CI_REPOSITORY" = "iMelki/paperclip"
          test "$CI_REPOSITORY_ID" = "1228063587"
          test "$CI_PRIVATE" = "false"
          test "$CI_RUNNER_ENVIRONMENT" = "github-hosted"
          test "$CI_RUNNER_OS" = "Linux"
          test "$CI_RUNNER_ARCH" = "X64"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore hash-bound regenerated lockfile
        if: needs.policy.outputs.lockfile_regenerated == '1'
        env:
          LOCKFILE_PARTS_COUNT: ${{ needs.policy.outputs.lockfile_parts_count }}
          LOCKFILE_PART_0: ${{ needs.policy.outputs.lockfile_part_0 }}
          LOCKFILE_PART_1: ${{ needs.policy.outputs.lockfile_part_1 }}
          LOCKFILE_PART_2: ${{ needs.policy.outputs.lockfile_part_2 }}
          LOCKFILE_PART_3: ${{ needs.policy.outputs.lockfile_part_3 }}
          LOCKFILE_PART_4: ${{ needs.policy.outputs.lockfile_part_4 }}
          LOCKFILE_PART_5: ${{ needs.policy.outputs.lockfile_part_5 }}
          LOCKFILE_PART_6: ${{ needs.policy.outputs.lockfile_part_6 }}
          LOCKFILE_PART_7: ${{ needs.policy.outputs.lockfile_part_7 }}
        run: |
          node --input-type=module <<'JS'
          import { writeFile } from "node:fs/promises";
          import { decodeLockfileOutputs } from "./.github/scripts/ci-lockfile-transfer.mjs";
          await writeFile("pnpm-lock.yaml", decodeLockfileOutputs(process.env.LOCKFILE_PARTS_COUNT, Array.from({ length: 8 }, (_, i) => process.env[`LOCKFILE_PART_${i}`]), process.env.GITHUB_SHA));
          JS

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run grouped general test suites
        run: |
          if [ -n "${{ matrix.shard_count }}" ]; then
            pnpm test:run:general -- --group '${{ matrix.group }}' \
              --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }}
          else
            pnpm test:run:general -- --group '${{ matrix.group }}'
          fi

  verify:
    # Preserve the legacy required-check name while the underlying work runs in parallel.
    name: verify
    # A skip-style job guard would make a fork PR's required check count as
    # passing. The aggregate always runs on the public isolated route and fails
    # fork requests before checkout. Non-public or unknown contexts have no
    # admitted runner route, and can never become a skipped success.
    if: ${{ always() }}
    needs: [typecheck_release_registry, general_tests, build]
    runs-on: ${{ fromJSON(github.repository == 'iMelki/paperclip' && github.repository_id == '1228063587' && toJSON(github.event.repository.private) == 'false' && '["ubuntu-24.04"]' || '["self-hosted","paperclip-public-ci-denied"]') }}
    # Public context selects an isolated standard VM; any fallback fails before checkout.
    timeout-minutes: 50

    steps:
      - name: Confirm approved public CI context
        id: public_ci_guard
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_REPOSITORY_ID: ${{ github.repository_id }}
          CI_PRIVATE: ${{ toJSON(github.event.repository.private) }}
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_RUNNER_OS: ${{ runner.os }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          test "$CI_REPOSITORY" = "iMelki/paperclip"
          test "$CI_REPOSITORY_ID" = "1228063587"
          test "$CI_PRIVATE" = "false"
          test "$CI_RUNNER_ENVIRONMENT" = "github-hosted"
          test "$CI_RUNNER_OS" = "Linux"
          test "$CI_RUNNER_ARCH" = "X64"

      - name: Fail fork PRs (CI runs only on same-repo branches)
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::fork PR: CI runs only on same-repo branches, maintainer re-run needed"
            exit 1
          fi
          echo "same-repo or non-PR event: gate passed"
      - name: Fail if any split verify lane failed
        env:
          TYPECHECK_RELEASE_REGISTRY_RESULT: ${{ needs.typecheck_release_registry.result }}
          GENERAL_TESTS_RESULT: ${{ needs.general_tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$TYPECHECK_RELEASE_REGISTRY_RESULT" = "success"
          test "$GENERAL_TESTS_RESULT" = "success"
          test "$BUILD_RESULT" = "success"

  build:
    name: Build
    needs: [policy]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(github.repository == 'iMelki/paperclip' && github.repository_id == '1228063587' && toJSON(github.event.repository.private) == 'false' && '["ubuntu-24.04"]' || '["self-hosted","paperclip-public-ci-denied"]') }}
    # Public context selects an isolated standard VM; any fallback fails before checkout.
    timeout-minutes: 65

    steps:
      - name: Confirm approved public CI context
        id: public_ci_guard
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_REPOSITORY_ID: ${{ github.repository_id }}
          CI_PRIVATE: ${{ toJSON(github.event.repository.private) }}
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_RUNNER_OS: ${{ runner.os }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          test "$CI_REPOSITORY" = "iMelki/paperclip"
          test "$CI_REPOSITORY_ID" = "1228063587"
          test "$CI_PRIVATE" = "false"
          test "$CI_RUNNER_ENVIRONMENT" = "github-hosted"
          test "$CI_RUNNER_OS" = "Linux"
          test "$CI_RUNNER_ARCH" = "X64"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore hash-bound regenerated lockfile
        if: needs.policy.outputs.lockfile_regenerated == '1'
        env:
          LOCKFILE_PARTS_COUNT: ${{ needs.policy.outputs.lockfile_parts_count }}
          LOCKFILE_PART_0: ${{ needs.policy.outputs.lockfile_part_0 }}
          LOCKFILE_PART_1: ${{ needs.policy.outputs.lockfile_part_1 }}
          LOCKFILE_PART_2: ${{ needs.policy.outputs.lockfile_part_2 }}
          LOCKFILE_PART_3: ${{ needs.policy.outputs.lockfile_part_3 }}
          LOCKFILE_PART_4: ${{ needs.policy.outputs.lockfile_part_4 }}
          LOCKFILE_PART_5: ${{ needs.policy.outputs.lockfile_part_5 }}
          LOCKFILE_PART_6: ${{ needs.policy.outputs.lockfile_part_6 }}
          LOCKFILE_PART_7: ${{ needs.policy.outputs.lockfile_part_7 }}
        run: |
          node --input-type=module <<'JS'
          import { writeFile } from "node:fs/promises";
          import { decodeLockfileOutputs } from "./.github/scripts/ci-lockfile-transfer.mjs";
          await writeFile("pnpm-lock.yaml", decodeLockfileOutputs(process.env.LOCKFILE_PARTS_COUNT, Array.from({ length: 8 }, (_, i) => process.env[`LOCKFILE_PART_${i}`]), process.env.GITHUB_SHA));
          JS

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  verify_serialized_server:
    name: Verify serialized server suites (${{ matrix.shard_label }})
    needs: [policy]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(github.repository == 'iMelki/paperclip' && github.repository_id == '1228063587' && toJSON(github.event.repository.private) == 'false' && '["ubuntu-24.04"]' || '["self-hosted","paperclip-public-ci-denied"]') }}
    # Public context selects an isolated standard VM; any fallback fails before checkout.
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          # A successful PR run on 2026-08-04 (30876682788) spent 256s in
          # serialized shard 2/4, making its 305s job the run's slowest check.
          # Five shards reduce the measured 739s suite total to about 148s per
          # runner before setup overhead.
          - shard_index: 0
            shard_count: 5
            shard_label: 1/5
          - shard_index: 1
            shard_count: 5
            shard_label: 2/5
          - shard_index: 2
            shard_count: 5
            shard_label: 3/5
          - shard_index: 3
            shard_count: 5
            shard_label: 4/5
          - shard_index: 4
            shard_count: 5
            shard_label: 5/5

    steps:
      - name: Confirm approved public CI context
        id: public_ci_guard
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_REPOSITORY_ID: ${{ github.repository_id }}
          CI_PRIVATE: ${{ toJSON(github.event.repository.private) }}
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_RUNNER_OS: ${{ runner.os }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          test "$CI_REPOSITORY" = "iMelki/paperclip"
          test "$CI_REPOSITORY_ID" = "1228063587"
          test "$CI_PRIVATE" = "false"
          test "$CI_RUNNER_ENVIRONMENT" = "github-hosted"
          test "$CI_RUNNER_OS" = "Linux"
          test "$CI_RUNNER_ARCH" = "X64"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore hash-bound regenerated lockfile
        if: needs.policy.outputs.lockfile_regenerated == '1'
        env:
          LOCKFILE_PARTS_COUNT: ${{ needs.policy.outputs.lockfile_parts_count }}
          LOCKFILE_PART_0: ${{ needs.policy.outputs.lockfile_part_0 }}
          LOCKFILE_PART_1: ${{ needs.policy.outputs.lockfile_part_1 }}
          LOCKFILE_PART_2: ${{ needs.policy.outputs.lockfile_part_2 }}
          LOCKFILE_PART_3: ${{ needs.policy.outputs.lockfile_part_3 }}
          LOCKFILE_PART_4: ${{ needs.policy.outputs.lockfile_part_4 }}
          LOCKFILE_PART_5: ${{ needs.policy.outputs.lockfile_part_5 }}
          LOCKFILE_PART_6: ${{ needs.policy.outputs.lockfile_part_6 }}
          LOCKFILE_PART_7: ${{ needs.policy.outputs.lockfile_part_7 }}
        run: |
          node --input-type=module <<'JS'
          import { writeFile } from "node:fs/promises";
          import { decodeLockfileOutputs } from "./.github/scripts/ci-lockfile-transfer.mjs";
          await writeFile("pnpm-lock.yaml", decodeLockfileOutputs(process.env.LOCKFILE_PARTS_COUNT, Array.from({ length: 8 }, (_, i) => process.env[`LOCKFILE_PART_${i}`]), process.env.GITHUB_SHA));
          JS

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run serialized server test shard
        run: pnpm test:run:serialized -- --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }}

  canary_dry_run:
    name: Canary Dry Run
    needs: [policy]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(github.repository == 'iMelki/paperclip' && github.repository_id == '1228063587' && toJSON(github.event.repository.private) == 'false' && '["ubuntu-24.04"]' || '["self-hosted","paperclip-public-ci-denied"]') }}
    # Public context selects an isolated standard VM; any fallback fails before checkout.
    timeout-minutes: 65

    steps:
      - name: Confirm approved public CI context
        id: public_ci_guard
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_REPOSITORY_ID: ${{ github.repository_id }}
          CI_PRIVATE: ${{ toJSON(github.event.repository.private) }}
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_RUNNER_OS: ${{ runner.os }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          test "$CI_REPOSITORY" = "iMelki/paperclip"
          test "$CI_REPOSITORY_ID" = "1228063587"
          test "$CI_PRIVATE" = "false"
          test "$CI_RUNNER_ENVIRONMENT" = "github-hosted"
          test "$CI_RUNNER_OS" = "Linux"
          test "$CI_RUNNER_ARCH" = "X64"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore hash-bound regenerated lockfile
        if: needs.policy.outputs.lockfile_regenerated == '1'
        env:
          LOCKFILE_PARTS_COUNT: ${{ needs.policy.outputs.lockfile_parts_count }}
          LOCKFILE_PART_0: ${{ needs.policy.outputs.lockfile_part_0 }}
          LOCKFILE_PART_1: ${{ needs.policy.outputs.lockfile_part_1 }}
          LOCKFILE_PART_2: ${{ needs.policy.outputs.lockfile_part_2 }}
          LOCKFILE_PART_3: ${{ needs.policy.outputs.lockfile_part_3 }}
          LOCKFILE_PART_4: ${{ needs.policy.outputs.lockfile_part_4 }}
          LOCKFILE_PART_5: ${{ needs.policy.outputs.lockfile_part_5 }}
          LOCKFILE_PART_6: ${{ needs.policy.outputs.lockfile_part_6 }}
          LOCKFILE_PART_7: ${{ needs.policy.outputs.lockfile_part_7 }}
        run: |
          node --input-type=module <<'JS'
          import { writeFile } from "node:fs/promises";
          import { decodeLockfileOutputs } from "./.github/scripts/ci-lockfile-transfer.mjs";
          await writeFile("pnpm-lock.yaml", decodeLockfileOutputs(process.env.LOCKFILE_PARTS_COUNT, Array.from({ length: 8 }, (_, i) => process.env[`LOCKFILE_PART_${i}`]), process.env.GITHUB_SHA));
          JS

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `release.sh` always executes its Step 2/7 workspace build, even when
      # `--skip-verify` bypasses the initial verification gate. release.sh
      # also requires a clean working tree, so any in-place lockfile churn
      # from `pnpm install --frozen-lockfile` must be reverted first — unless
      # the policy job uploaded a regenerated lockfile (manifest-changing
      # PRs), in which case we stage the artifact-restored copy into an
      # ephemeral local commit so release.sh sees a clean tree and its
      # workspace build sees a lockfile that matches the manifest.
      - name: Release canary dry run via release.sh internal build
        env:
          USED_ARTIFACT_LOCKFILE: ${{ needs.policy.outputs.lockfile_regenerated || '0' }}
        run: |
          git checkout -B master HEAD
          if [ "$USED_ARTIFACT_LOCKFILE" = "1" ]; then
            git add pnpm-lock.yaml
            if ! git diff --cached --quiet; then
              git -c user.email=ci@paperclip.local -c user.name=CI \
                commit --no-verify -m "ci(canary): stage regenerated lockfile"
            fi
          else
            git checkout -- pnpm-lock.yaml
          fi
          ./scripts/release.sh canary --skip-verify --dry-run

  e2e_shards:
    name: e2e shard (${{ matrix.shard_label }})
    needs: [policy]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(github.repository == 'iMelki/paperclip' && github.repository_id == '1228063587' && toJSON(github.event.repository.private) == 'false' && '["ubuntu-24.04"]' || '["self-hosted","paperclip-public-ci-denied"]') }}
    # Public context selects an isolated standard VM; any fallback fails before checkout.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Playwright lane is pinned to workers=1 (tests/e2e/playwright.config.ts)
          # because every spec shares one throwaway server and some toggle
          # instance-level flags, so it can only be parallelized across runners.
          # Each shard boots its own server, which keeps that isolation intact.
          # Three shards let the ~3min smoke-lab spec ride alone while the rest
          # of the catalog splits evenly, pulling this lane off the PR critical
          # path (it was the slowest check at ~8min20s with two shards).
          - shard_index: 0
            shard_count: 3
            shard_label: 1/3
          - shard_index: 1
            shard_count: 3
            shard_label: 2/3
          - shard_index: 2
            shard_count: 3
            shard_label: 3/3

    steps:
      - name: Confirm approved public CI context
        id: public_ci_guard
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_REPOSITORY_ID: ${{ github.repository_id }}
          CI_PRIVATE: ${{ toJSON(github.event.repository.private) }}
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_RUNNER_OS: ${{ runner.os }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          test "$CI_REPOSITORY" = "iMelki/paperclip"
          test "$CI_REPOSITORY_ID" = "1228063587"
          test "$CI_PRIVATE" = "false"
          test "$CI_RUNNER_ENVIRONMENT" = "github-hosted"
          test "$CI_RUNNER_OS" = "Linux"
          test "$CI_RUNNER_ARCH" = "X64"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore hash-bound regenerated lockfile
        if: needs.policy.outputs.lockfile_regenerated == '1'
        env:
          LOCKFILE_PARTS_COUNT: ${{ needs.policy.outputs.lockfile_parts_count }}
          LOCKFILE_PART_0: ${{ needs.policy.outputs.lockfile_part_0 }}
          LOCKFILE_PART_1: ${{ needs.policy.outputs.lockfile_part_1 }}
          LOCKFILE_PART_2: ${{ needs.policy.outputs.lockfile_part_2 }}
          LOCKFILE_PART_3: ${{ needs.policy.outputs.lockfile_part_3 }}
          LOCKFILE_PART_4: ${{ needs.policy.outputs.lockfile_part_4 }}
          LOCKFILE_PART_5: ${{ needs.policy.outputs.lockfile_part_5 }}
          LOCKFILE_PART_6: ${{ needs.policy.outputs.lockfile_part_6 }}
          LOCKFILE_PART_7: ${{ needs.policy.outputs.lockfile_part_7 }}
        run: |
          node --input-type=module <<'JS'
          import { writeFile } from "node:fs/promises";
          import { decodeLockfileOutputs } from "./.github/scripts/ci-lockfile-transfer.mjs";
          await writeFile("pnpm-lock.yaml", decodeLockfileOutputs(process.env.LOCKFILE_PARTS_COUNT, Array.from({ length: 8 }, (_, i) => process.env[`LOCKFILE_PART_${i}`]), process.env.GITHUB_SHA));
          JS

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runner Chrome
        # The rf-paperclip box runner has system Google Chrome installed, so the
        # headless e2e lane uses it (channel chrome) instead of downloading
        # Playwright browser bundles, which would also need sudo for --with-deps.
        # No config is written to the runner's persistent ~/.paperclip:
        # playwright.config.ts boots onboard in its own temp PAPERCLIP_HOME.
        run: google-chrome --version

      - name: Prepare this job's e2e home
        # One canonical dir per run, attempt, job and shard under RUNNER_TEMP,
        # with an identity marker. The cleanup step deletes only this dir.
        env:
          PAPERCLIP_E2E_OWNER_SUFFIX: ${{ matrix.shard_index }}
        run: ./scripts/ci/e2e-owned-cleanup.sh prepare

      - name: Run e2e tests
        env:
          # Tools in the run put temp files and unix sockets under TMPDIR. On
          # the box /tmp is a long-lived tmpfs, so point it at the per-job temp
          # dir. (The runner context is not available in job-level env.)
          TMPDIR: ${{ runner.temp }}
          PAPERCLIP_E2E_OWNER_SUFFIX: ${{ matrix.shard_index }}
          PAPERCLIP_E2E_SKIP_LLM: "true"
          PAPERCLIP_PLAYWRIGHT_CHANNEL: "chrome"
        run: |
          # Playwright's own --shard balances by test count, and one spec
          # (smoke-lab) is ~40% of the lane's wall clock. Partition by recorded
          # spec duration instead so both runners finish together.
          specs="$(node ./scripts/e2e-shard.mjs \
            --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }})"
          echo "shard ${{ matrix.shard_label }} specs: $specs"
          # The wrapper points playwright.config.ts's PAPERCLIP_HOME (embedded
          # Postgres data) at this job's owned dir via PAPERCLIP_E2E_HOME and
          # records the session it starts, so cleanup can tell this job's
          # processes and home apart from any other job's.
          ./scripts/ci/e2e-owned-cleanup.sh run -- pnpm run test:e2e $specs

      # Test output stays in normal job logs; no billable report artifact is uploaded.
      - name: Clean up this job's e2e server and temp home
        env:
          PAPERCLIP_E2E_OWNER_SUFFIX: ${{ matrix.shard_index }}
        # Kills only processes this job started (recorded session leader PID
        # plus start time, and the run's owner token in each process
        # environment) and deletes only this job's canonical home dir under
        # RUNNER_TEMP after checking its identity marker. No pattern, port or
        # /tmp matching, so a concurrent job on the same box is never touched.
        # Best effort: never fails the job.
        if: ${{ always() && steps.public_ci_guard.outcome == 'success' }}
        run: ./scripts/ci/e2e-owned-cleanup.sh cleanup

  e2e:
    # Preserve the legacy required-check name while the specs run sharded
    # across the matrix above (same pattern as the `verify` aggregate).
    name: e2e
    # A skip-style job guard would make a fork PR's required check count as
    # passing. The aggregate always runs on the public isolated route and fails
    # fork requests before checkout. Non-public or unknown contexts have no
    # admitted runner route, and can never become a skipped success.
    if: ${{ always() }}
    needs: [e2e_shards]
    runs-on: ${{ fromJSON(github.repository == 'iMelki/paperclip' && github.repository_id == '1228063587' && toJSON(github.event.repository.private) == 'false' && '["ubuntu-24.04"]' || '["self-hosted","paperclip-public-ci-denied"]') }}
    # Public context selects an isolated standard VM; any fallback fails before checkout.
    timeout-minutes: 50

    steps:
      - name: Confirm approved public CI context
        id: public_ci_guard
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_REPOSITORY_ID: ${{ github.repository_id }}
          CI_PRIVATE: ${{ toJSON(github.event.repository.private) }}
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_RUNNER_OS: ${{ runner.os }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          test "$CI_REPOSITORY" = "iMelki/paperclip"
          test "$CI_REPOSITORY_ID" = "1228063587"
          test "$CI_PRIVATE" = "false"
          test "$CI_RUNNER_ENVIRONMENT" = "github-hosted"
          test "$CI_RUNNER_OS" = "Linux"
          test "$CI_RUNNER_ARCH" = "X64"

      - name: Fail fork PRs (CI runs only on same-repo branches)
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::fork PR: CI runs only on same-repo branches, maintainer re-run needed"
            exit 1
          fi
          echo "same-repo or non-PR event: gate passed"
      - name: Fail if any e2e shard failed
        env:
          E2E_SHARDS_RESULT: ${{ needs.e2e_shards.result }}
        run: test "$E2E_SHARDS_RESULT" = "success"
